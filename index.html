<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jejak Solat Dewasa</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                        darkBorder: '#334155',
                        accentGreen: '#10b981',
                    }
                }
            }
        }
    </script>
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Jejak%20Solat%20Dewasa%22%2C%22short_name%22%3A%22JejakSolat%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'%2310b981'%3E%3Cpath%20d%3D'M12%202L2%207l10%205%2010-5-10-5zM2%2017l10%205%2010-5M2%2012l10%205%2010-5'%2F%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4">

    <!-- SKRIN KUNCI LESEN (DISEMBUNYIKAN JIKA SUDAH AKTIF) -->
    <div id="licenseScreen" class="fixed inset-0 bg-[#0f172a] z-50 flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="bg-[#1e293b] border border-[#334155] p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-2">🔒 Pengesahan Lesen</h2>
            <p class="text-slate-400 text-xs mb-4">Sila salin ID Peranti di bawah dan hantarkan kepada penjual untuk mendapatkan Kod Aktivasi.</p>
            
            <div class="bg-[#0f172a] p-3 rounded-lg border border-[#334155] mb-4 font-mono text-emerald-400 text-sm tracking-wider select-all" id="displayDeviceId">
                MENJANA ID...
            </div>

            <input type="text" id="activationInput" placeholder="Masukkan Kod Aktivasi" class="w-full bg-[#0f172a] border border-[#334155] text-white p-3 rounded-xl text-center text-sm mb-3 focus:outline-none focus:border-emerald-500 uppercase font-mono tracking-widest" />
            
            <button onclick="activateApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition text-sm">
                Aktifkan Aplikasi
            </button>
        </div>
    </div>

    <!-- KANDUNGAN UTAMA APLIKASI -->
    <div id="mainAppContent" class="w-full max-w-md mx-auto space-y-4">
        <!-- Pengepala -->
        <header class="flex justify-between items-center bg-[#1e293b] border border-[#334155] p-4 rounded-2xl shadow-md">
            <div>
                <h1 class="text-lg font-bold text-white">Jejak Solat Dewasa</h1>
                <p id="currentDateDisplay" class="text-xs text-slate-400"></p>
            </div>
            <button onclick="resetDataToday()" class="text-xs text-slate-400 hover:text-red-400 bg-[#0f172a] px-3 py-1.5 rounded-lg border border-[#334155]">Set Semula</button>
        </header>

        <!-- Navigasi Tab -->
        <nav class="flex bg-[#1e293b] border border-[#334155] p-1.5 rounded-2xl gap-2">
            <button onclick="switchTab('tracker')" id="tabBtnTracker" class="flex-1 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white transition">Tanda Solat</button>
            <button onclick="switchTab('history')" id="tabBtnHistory" class="flex-1 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition">Himpunan Catatan</button>
        </nav>

        <!-- Tab 1: Tanda Solat & Muhasabah -->
        <main id="tabTracker" class="space-y-4">
            <div class="bg-[#1e293b] border border-[#334155] p-4 rounded-2xl space-y-3 shadow-md">
                <h2 class="text-sm font-bold text-slate-200">Semakan Waktu Solat Fardhu</h2>
                <div id="solatList" class="space-y-2"></div>
            </div>

            <div class="bg-[#1e293b] border border-[#334155] p-4 rounded-2xl space-y-3 shadow-md">
                <h2 class="text-sm font-bold text-slate-200">Catatan & Muhasabah Harian</h2>
                <div class="relative">
                    <textarea id="muhasabahInput" rows="3" placeholder="Tulis catatan atau muhasabah hari ini..." class="w-full bg-[#0f172a] border border-[#334155] text-slate-200 text-xs p-3 rounded-xl focus:outline-none focus:border-emerald-500 resize-none"></textarea>
                    <button onclick="saveMuhasabah()" class="absolute bottom-3 right-3 bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-lg text-xs font-medium shadow flex items-center gap-1 transition">
                        ✓ Simpan
                    </button>
                </div>
            </div>
        </main>

        <!-- Tab 2: Himpunan Catatan & Muhasabah -->
        <main id="tabHistory" class="space-y-3 hidden">
            <div class="bg-[#1e293b] border border-[#334155] p-4 rounded-2xl shadow-md">
                <h2 class="text-sm font-bold text-slate-200 mb-3">Rekod Lepas & Suntingan</h2>
                <div id="historyList" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1"></div>
            </div>
        </main>
    </div>

    <!-- SCRIPT LOGIK LESEN & APLIKASI -->
    <script>
        // --- SISTEM LESEN KUNCI PERANTI ---
        let isActivated = localStorage.getItem("app_activated") === "true";
        let deviceId = localStorage.getItem("device_id");

        if (!deviceId) {
            deviceId = "DEV-" + Math.random().toString(36).substring(2, 9).toUpperCase();
            localStorage.setItem("device_id", deviceId);
        }

        function verifyActivationCode(inputCode, devId) {
            // Formula Kod: Terbalikkan DeviceId + "-PRO" (Contoh: DEV-ABC1234 -> 4321CBA-VED-PRO)
            let validCode = devId.split("").reverse().join("") + "-PRO";
            return inputCode.trim().toUpperCase() === validCode;
        }

        function checkLicense() {
            if (!isActivated) {
                document.getElementById("licenseScreen").classList.remove("hidden");
                document.getElementById("displayDeviceId").innerText = deviceId;
            } else {
                document.getElementById("licenseScreen").classList.add("hidden");
            }
        }

        function activateApp() {
            let userInput = document.getElementById("activationInput").value;
            if (verifyActivationCode(userInput, deviceId)) {
                localStorage.setItem("app_activated", "true");
                alert("Aplikasi berjaya diaktifkan!");
                location.reload();
            } else {
                alert("Kod aktivasi salah atau tidak sah untuk peranti ini!");
            }
        }

        // Jalankan semakan lesen serta-merta apabila fail dibuka
        checkLicense();

        // --- DATA & FUNGSI UTAMA APLIKASI SOLAT ---
        const solatNames = [
            { id: 'subuh', name: 'Subuh' },
            { id: 'zohor', name: 'Zohor' },
            { id: 'asar', name: 'Asar' },
            { id: 'maghrib', name: 'Maghrib' },
            { id: 'isyak', name: 'Isyak' }
        ];

        const statuses = [
            { id: 'qada', label: 'Qada', color: 'border-amber-500/40 text-amber-400 bg-amber-500/10' },
            { id: 'jemaah', label: 'Jemaah', color: 'border-emerald-500/40 text-emerald-400 bg-emerald-500/10' },
            { id: 'sendirian', label: 'Sendirian', color: 'border-blue-500/40 text-blue-400 bg-blue-500/10' },
            { id: 'tidak', label: 'Tidak Solat', color: 'border-red-500/40 text-red-400 bg-red-500/10' }
        ];

        function getTodayKey() {
            return new Date().toISOString().split('T')[0];
        }

        function getDataStore() {
            let data = localStorage.getItem('jejak_solat_data_v2');
            return data ? JSON.parse(data) : {};
        }

        function saveDataStore(data) {
            localStorage.setItem('jejak_solat_data_v2', JSON.stringify(data));
        }

        function initTodayData() {
            let store = getDataStore();
            let today = getTodayKey();
            if (!store[today]) {
                store[today] = {
                    solat: { subuh: '', zohor: '', asar: '', maghrib: '', isyak: '' },
                    muhasabah: ''
                };
                saveDataStore(store);
            }
            return store;
        }

        // Paparkan Tarikh Hari Ini
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('ms-MY', options);

        function renderSolatList() {
            let store = initTodayData();
            let today = getTodayKey();
            let todayData = store[today].solat;
            let container = document.getElementById('solatList');
            container.innerHTML = '';

            solatNames.forEach(item => {
                let currentStatus = todayData[item.id] || '';
                let html = `<div class="flex items-center justify-between bg-[#0f172a] p-3 rounded-xl border border-[#334155]">
                    <span class="text-xs font-semibold text-slate-200">${item.name}</span>
                    <div class="flex gap-1.5">`;

                statuses.forEach(st => {
                    let activeClass = currentStatus === st.id ? `${st.color} font-bold ring-1 ring-emerald-500` : 'border-[#334155] text-slate-400 hover:border-slate-400';
                    html += `<button onclick="updateSolat('${item.id}', '${st.id}')" class="text-[10px] px-2.5 py-1 rounded-lg border transition ${activeClass}">${st.label}</button>`;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });

            document.getElementById('muhasabahInput').value = store[today].muhasabah || '';
        }

        function updateSolat(solatId, statusId) {
            let store = getDataStore();
            let today = getTodayKey();
            store[today].solat[solatId] = statusId;
            saveDataStore(store);
            renderSolatList();
        }

        function saveMuhasabah() {
            let text = document.getElementById('muhasabahInput').value;
            let store = getDataStore();
            let today = getTodayKey();
            store[today].muhasabah = text;
            saveDataStore(store);
            alert('Catatan muhasabah berjaya disimpan!');
            renderHistoryList();
        }

        function resetDataToday() {
            if (confirm('Tetapkan semula data solat hari ini?')) {
                let store = getDataStore();
                let today = getTodayKey();
                if (store[today]) {
                    store[today].solat = { subuh: '', zohor: '', asar: '', maghrib: '', isyak: '' };
                    store[today].muhasabah = '';
                    saveDataStore(store);
                    renderSolatList();
                    renderHistoryList();
                }
            }
        }

        function renderHistoryList() {
            let store = getDataStore();
            let container = document.getElementById('historyList');
            container.innerHTML = '';

            let sortedDates = Object.keys(store).sort().reverse();

            if (sortedDates.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Tiada rekod tersimpan lagi.</p>`;
                return;
            }

            sortedDates.forEach(date => {
                let entry = store[date];
                let note = entry.muhasabah || 'Tiada catatan.';
                container.innerHTML += `
                    <div class="bg-[#0f172a] border border-[#334155] p-3 rounded-xl space-y-2">
                        <div class="flex justify-between items-center border-b border-[#334155] pb-1.5">
                            <span class="text-xs font-bold text-emerald-400">${date}</span>
                        </div>
                        <p class="text-xs text-slate-300 italic" id="note-text-${date}">${note}</p>
                        <div id="note-edit-area-${date}" class="hidden space-y-2">
                            <textarea id="note-input-${date}" class="w-full bg-[#1e293b] border border-[#334155] text-slate-200 text-xs p-2 rounded-lg resize-none">${entry.muhasabah || ''}</textarea>
                            <button onclick="saveHistoryNote('${date}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] px-3 py-1 rounded-lg font-medium">Simpan Perubahan</button>
                        </div>
                        <div class="flex justify-end pt-1">
                            <button onclick="toggleEditHistory('${date}')" id="edit-btn-${date}" class="text-[10px] text-slate-400 hover:text-white bg-[#1e293b] px-2.5 py-1 rounded border border-[#334155]">Sunting Nota</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleEditHistory(date) {
            let textElem = document.getElementById(`note-text-${date}`);
            let editArea = document.getElementById(`note-edit-area-${date}`);
            let btn = document.getElementById(`edit-btn-${date}`);

            if (editArea.classList.contains('hidden')) {
                editArea.classList.remove('hidden');
                textElem.classList.add('hidden');
                btn.innerText = 'Batal';
            } else {
                editArea.classList.add('hidden');
                textElem.classList.remove('hidden');
                btn.innerText = 'Sunting Nota';
            }
        }

        function saveHistoryNote(date) {
            let newText = document.getElementById(`note-input-${date}`).value;
            let store = getDataStore();
            if (store[date]) {
                store[date].muhasabah = newText;
                saveDataStore(store);
                renderHistoryList();
            }
        }

        function switchTab(tab) {
            let trackerTab = document.getElementById('tabTracker');
            let historyTab = document.getElementById('tabHistory');
            let btnTracker = document.getElementById('tabBtnTracker');
            let btnHistory = document.getElementById('tabBtnHistory');

            if (tab === 'tracker') {
                trackerTab.classList.remove('hidden');
                historyTab.classList.add('hidden');
                btnTracker.className = "flex-1 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white transition";
                btnHistory.className = "flex-1 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition";
                renderSolatList();
            } else {
                trackerTab.classList.add('hidden');
                historyTab.classList.remove('hidden');
                btnHistory.className = "flex-1 py-2 text-xs font-semibold rounded-xl bg-emerald-600 text-white transition";
                btnTracker.className = "flex-1 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition";
                renderHistoryList();
            }
        }

        // Muat turun paparan awal
        renderSolatList();
    </script>
</body>
</html>
